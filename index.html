<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Weather Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 25px;
    }

    /* Search */
    .search-box {
      display: flex;
      gap: 10px;
      max-width: 600px;
      margin: auto;
    }

    .search-box input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .search-box button {
      padding: 14px 25px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .search-box button:hover {
      background: #444;
    }

    /* Error */
    .error {
      text-align: center;
      color: #b00020;
      background: white;
      padding: 10px;
      border-radius: 8px;
      margin: 20px auto;
      max-width: 600px;
      display: none;
    }

    /* Current Weather */
    .current-weather {
      background: rgba(255, 255, 255, 0.95);
      margin-top: 30px;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .current-weather img {
      width: 100px;
    }

    .temperature {
      font-size: 55px;
      font-weight: bold;
      margin: 10px 0;
    }

    .description {
      text-transform: capitalize;
      color: #666;
      font-size: 20px;
    }

    .details {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .details div {
      font-size: 16px;
    }

    /* Forecast */
    .forecast-title {
      color: white;
      margin: 30px 0 15px;
    }

    .forecast {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
    }

    .forecast-card {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px 10px;
      border-radius: 15px;
      text-align: center;
      transition: 0.3s;
    }

    .forecast-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .forecast-card img {
      width: 60px;
    }

    .forecast-card h3 {
      margin-bottom: 8px;
    }

    .forecast-card p {
      margin: 5px 0;
    }

    @media (max-width: 700px) {
      .forecast {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 450px) {
      .search-box {
        flex-direction: column;
      }

      .forecast {
        grid-template-columns: 1fr;
      }

      .temperature {
        font-size: 45px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Live Weather Dashboard</h1>

    <div class="search-box">
      <input
        type="text"
        id="cityInput"
        placeholder="Enter city name..."
      >
      <button id="searchBtn">Search</button>
    </div>

    <div class="error" id="errorMessage"></div>

    <div class="current-weather" id="currentWeather">
      <h2 id="cityName">Search for a city</h2>

      <img id="weatherIcon" src="" alt="Weather Icon">

      <div class="temperature" id="temperature">--°C</div>

      <p class="description" id="description">
        Weather information will appear here
      </p>

      <div class="details">
        <div>
          <strong>Humidity</strong>
          <p id="humidity">--%</p>
        </div>

        <div>
          <strong>Wind</strong>
          <p id="wind">-- km/h</p>
        </div>

        <div>
          <strong>Feels Like</strong>
          <p id="feelsLike">--°C</p>
        </div>
      </div>
    </div>

    <h2 class="forecast-title">5-Day Forecast</h2>

    <div class="forecast" id="forecast">
      <!-- Forecast cards injected using JavaScript -->
    </div>

  </div>

  <script>
    const API_KEY = "YOUR_OPENWEATHER_API_KEY";

    const cityInput = document.getElementById("cityInput");
    const searchBtn = document.getElementById("searchBtn");
    const errorMessage = document.getElementById("errorMessage");

    searchBtn.addEventListener("click", getWeather);

    cityInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        getWeather();
      }
    });

    async function getWeather() {
      const city = cityInput.value.trim();

      if (city === "") {
        showError("Please enter a city name.");
        return;
      }

      hideError();

      try {
        const currentURL =
          `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;

        const forecastURL =
          `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric`;

        const [currentResponse, forecastResponse] = await Promise.all([
          fetch(currentURL),
          fetch(forecastURL)
        ]);

        if (!currentResponse.ok || !forecastResponse.ok) {
          throw new Error("City not found.");
        }

        const currentData = await currentResponse.json();
        const forecastData = await forecastResponse.json();

        displayCurrentWeather(currentData);
        displayForecast(forecastData);

      } catch (error) {
        showError(error.message);
      }
    }

    function displayCurrentWeather(data) {
      document.getElementById("cityName").textContent =
        `${data.name}, ${data.sys.country}`;

      document.getElementById("temperature").textContent =
        `${Math.round(data.main.temp)}°C`;

      document.getElementById("description").textContent =
        data.weather[0].description;

      document.getElementById("humidity").textContent =
        `${data.main.humidity}%`;

      document.getElementById("wind").textContent =
        `${data.wind.speed} m/s`;

      document.getElementById("feelsLike").textContent =
        `${Math.round(data.main.feels_like)}°C`;

      document.getElementById("weatherIcon").src =
        `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
    }

    function displayForecast(data) {
      const forecastContainer = document.getElementById("forecast");

      forecastContainer.innerHTML = "";

      // Select one forecast for approximately each day
      const dailyForecast = data.list.filter(item =>
        item.dt_txt.includes("12:00:00")
      ).slice(0, 5);

      dailyForecast.forEach(day => {
        const date = new Date(day.dt * 1000);

        const card = document.createElement("div");
        card.classList.add("forecast-card");

        card.innerHTML = `
          <h3>
            ${date.toLocaleDateString("en-US", {
              weekday: "short"
            })}
          </h3>

          <img
            src="https://openweathermap.org/img/wn/${day.weather[0].icon}@2x.png"
            alt="${day.weather[0].description}"
          >

          <p>
            <strong>${Math.round(day.main.temp)}°C</strong>
          </p>

          <p>${day.weather[0].description}</p>

          <p>Humidity: ${day.main.humidity}%</p>
        `;

        forecastContainer.appendChild(card);
      });
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
    }

    function hideError() {
      errorMessage.style.display = "none";
    }
  </script>

</body>
</html>
